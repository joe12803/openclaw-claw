name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      relay_api_base:
        description: 'Relay API Base URL'
        default: 'https://openclaw.994938.xyz/v1'
        required: true
      relay_api_key:
        description: 'Relay API Key'
        default: 'sk-KhbSk9pyLHkw8AzPy'
        required: true
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manual Installation
        run: |
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw.git ~/openclaw-src
          cd ~/openclaw-src
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Configure OpenClaw
        env:
          RELAY_API_KEY: ${{ github.event.inputs.relay_api_key }}
          RELAY_API_BASE: ${{ github.event.inputs.relay_api_base }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          cat <<EOF > config_template.json
          {
            "server": { "port": 18789, "host": "0.0.0.0" },
            "gateway": {
              "auth": { "enabled": true, "token": "${GATEWAY_TOKEN:-openclaw-secret}" }
            },
            "providers": [
              {
                "id": "relay-api",
                "type": "openai",
                "enabled": true,
                "config": {
                  "apiKey": "${RELAY_API_KEY}",
                  "baseUrl": "${RELAY_API_BASE}"
                },
                "models": [
                  { "id": "gemini-3-flash", "name": "Gemini 3 Flash (Relay)" }
                ]
              }
            ]
          }
          EOF
          mkdir -p ~/.openclaw/config
          mkdir -p ~/openclaw-src/config
          cp config_template.json ~/.openclaw/config.json
          cp config_template.json ~/openclaw-src/config.json
          cp config_template.json ~/openclaw-src/openclaw.json
          cp config_template.json ~/openclaw-src/config/config.json

      - name: Start OpenClaw
        run: |
          export OPENCLAW_NONINTERACTIVE=true
          export CI=true
          sudo apt-get install -y expect
          cd ~/openclaw-src
          unbuffer ./openclaw.mjs gateway --verbose --allow-unconfigured > openclaw.log 2>&1 &
          
          echo "Waiting for OpenClaw Gateway..."
          MAX_RETRIES=40
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:18789 > /dev/null; then
              echo "✅ Gateway is up!"
              break
            fi
            sleep 5
            COUNT=$((COUNT+1))
          done

      - name: Start Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://localhost:18789 > tunnel.log 2>&1 &
          
          echo "Waiting for Cloudflare Tunnel URL (Max 60s)..."
          T_COUNT=0
          while [ $T_COUNT -lt 20 ]; do
            # 提取 URL
            DETECTED=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$DETECTED" ]; then
              echo "URL_DETECTED=$DETECTED" >> $GITHUB_ENV
              echo "Detected URL: $DETECTED"
              break
            fi
            sleep 3
            T_COUNT=$((T_COUNT+1))
          done

      - name: Notify Deployment
        # 只要检测到 URL 就发送通知
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          # 使用步骤中检测到的环境变量
          FINAL_URL: ${{ env.URL_DETECTED }}
        run: |
          python3 - <<EOF
          import os, requests, json
          url = os.environ.get('FINAL_URL')
          if not url:
              print("❌ No Tunnel URL found in environment. Notification aborted.")
              exit(0)
          
          token = os.environ.get('GATEWAY_TOKEN') or 'openclaw-secret'
          msg = f"🚀 OpenClaw 部署成功！\n🔗 API Base: {url}/v1\n🔑 Gateway Token: {token}\n🤖 测试模型: gemini-3-flash"
          
          print(f"Preparing to send notification for URL: {url}")
          
          # Telegram
          tg_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          tg_chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if tg_token and tg_chat_id:
              r = requests.post(f"https://api.telegram.org/bot{tg_token}/sendMessage", json={"chat_id": tg_chat_id, "text": msg})
              print(f"Telegram status: {r.status_code}")
          
          # Feishu
          fs_id = os.environ.get('FEISHU_APP_ID')
          fs_secret = os.environ.get('FEISHU_APP_SECRET')
          fs_chat_id = os.environ.get('FEISHU_CHAT_ID')
          if fs_id and fs_secret and fs_chat_id:
              token_url = "https://open.feishu.cn/open-apis/auth/v3/app_access_token/internal"
              token_res = requests.post(token_url, json={"app_id": fs_id, "app_secret": fs_secret}).json()
              app_token = token_res.get('app_access_token')
              if app_token:
                  send_url = "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id"
                  headers = {"Authorization": f"Bearer {app_token}", "Content-Type": "application/json"}
                  payload = {"receive_id": fs_chat_id, "msg_type": "text", "content": json.dumps({"text": msg})}
                  r = requests.post(send_url, headers=headers, json=payload)
                  print(f"Feishu status: {r.status_code}")
          EOF

      - name: Keep Alive
        run: sleep 21600
