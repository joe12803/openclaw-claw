name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw.git ~/openclaw-src
          cd ~/openclaw-src
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Install Chrome, Cloudflared, and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          pip install requests

      - name: Configure OpenClaw
        env:
          CLAUDE_SESSION_KEY: ${{ secrets.CLAUDE_SESSION_KEY }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          cd ~/openclaw-src
          # 创建核心配置文件
          cat <<EOF > openclaw.json
          {
            "server": {
              "port": 3002,
              "host": "0.0.0.0"
            },
            "gateway": {
              "auth": {
                "enabled": true,
                "token": "${GATEWAY_TOKEN:-openclaw-secret}"
              }
            }
          }
          EOF

      - name: Start Services
        run: |
          cd ~/openclaw-src
          google-chrome-stable --headless=new --remote-debugging-port=9222 --no-sandbox > chrome.log 2>&1 &
          
          # 核心改动：直接运行网关模式，绕过 Crestodian 交互管理器
          # 使用 node openclaw.mjs gateway 命令启动
          node openclaw.mjs gateway > openclaw.log 2>&1 &
          
          echo "Waiting for OpenClaw Gateway to respond on port 3002..."
          MAX_RETRIES=40
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:3002 > /dev/null; then
              echo "OpenClaw Gateway is up and running!"
              break
            fi
            echo "Waiting for Gateway response... ($((COUNT+1))/$MAX_RETRIES)"
            sleep 5
            COUNT=$((COUNT+1))
          done
          
          if ! curl -s http://localhost:3002 > /dev/null; then
            echo "ERROR: OpenClaw Gateway failed to start."
            cat openclaw.log
            exit 1
          fi
          
          if [ "${{ github.event.inputs.use_tunnel }}" == "true" ]; then
            cloudflared tunnel --url http://localhost:3002 > tunnel.log 2>&1 &
            sleep 15
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "URL_DETECTED=$TUNNEL_URL"
          fi

      - name: Notify Deployment
        if: env.URL_DETECTED != ''
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          TUNNEL_URL: ${{ env.URL_DETECTED }}
        run: |
          python3 - <<EOF
          import os, requests, json
          url = os.environ.get('TUNNEL_URL')
          token = os.environ.get('GATEWAY_TOKEN') or 'openclaw-secret'
          msg = f"🚀 OpenClaw 部署成功！\n🔗 API Base: {url}/v1\n🔑 Gateway Token: {token}\n⏳ 持续时间: 6小时"
          
          # Telegram
          tg_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          tg_chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if tg_token and tg_chat_id:
              requests.post(f"https://api.telegram.org/bot{tg_token}/sendMessage", json={"chat_id": tg_chat_id, "text": msg}, timeout=10)
          
          # Feishu
          fs_id = os.environ.get('FEISHU_APP_ID')
          fs_secret = os.environ.get('FEISHU_APP_SECRET')
          fs_chat_id = os.environ.get('FEISHU_CHAT_ID')
          if fs_id and fs_secret and fs_chat_id:
              token_url = "https://open.feishu.cn/open-apis/auth/v3/app_access_token/internal"
              token_res = requests.post(token_url, json={"app_id": fs_id, "app_secret": fs_secret}, timeout=10).json()
              app_token = token_res.get('app_access_token')
              if app_token:
                  send_url = "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id"
                  headers = {"Authorization": f"Bearer {app_token}", "Content-Type": "application/json"}
                  payload = {"receive_id": fs_chat_id, "msg_type": "text", "content": json.dumps({"text": msg})}
                  requests.post(send_url, headers=headers, json=payload, timeout=10)
          EOF

      - name: Keep Alive
        run: sleep 21600
