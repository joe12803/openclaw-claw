name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      relay_api_base:
        description: 'Relay API Base URL'
        default: 'https://openclaw.994938.xyz/v1'
        required: true
      relay_api_key:
        description: 'Relay API Key'
        default: 'sk-KhbSk9pyLHkw8AzPy'
        required: true
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manual Installation
        run: |
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw.git ~/openclaw-src
          cd ~/openclaw-src
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Configure OpenClaw (Full Linkage)
        env:
          RELAY_API_KEY: ${{ github.event.inputs.relay_api_key }}
          RELAY_API_BASE: ${{ github.event.inputs.relay_api_base }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          cd ~/openclaw-src
          mkdir -p config
          
          # 创建一站式配置：API + WebUI + Bots
          cat <<EOF > config/config.json
          {
            "server": { "port": 18789, "host": "0.0.0.0" },
            "gateway": {
              "auth": { "enabled": true, "token": "${GATEWAY_TOKEN:-openclaw-secret}" }
            },
            "providers": [
              {
                "id": "relay-api",
                "type": "openai",
                "enabled": true,
                "config": {
                  "apiKey": "${RELAY_API_KEY}",
                  "baseUrl": "${RELAY_API_BASE}"
                },
                "models": [
                  { "id": "gemini-3-flash", "name": "Gemini 3 Flash", "default": true }
                ]
              }
            ],
            "adapters": {
              "webui": { "enabled": true, "config": { "port": 18789 } },
              "telegram": {
                "enabled": true,
                "config": { "token": "${TELEGRAM_BOT_TOKEN}" }
              },
              "feishu": {
                "enabled": true,
                "config": {
                  "appId": "${FEISHU_APP_ID}",
                  "appSecret": "${FEISHU_APP_SECRET}"
                }
              }
            },
            "agents": {
              "main": { "model": "relay-api/gemini-3-flash" }
            }
          }
          EOF
          cp config/config.json ./openclaw.json

      - name: Start OpenClaw
        run: |
          export OPENCLAW_NONINTERACTIVE=true
          export CI=true
          sudo apt-get install -y expect
          cd ~/openclaw-src
          unbuffer ./openclaw.mjs gateway --verbose --allow-unconfigured > openclaw.log 2>&1 &
          
          echo "Waiting for OpenClaw Gateway..."
          MAX_RETRIES=40
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:18789 > /dev/null; then
              echo "✅ OpenClaw Gateway & WebUI are live!"
              break
            fi
            sleep 5
            COUNT=$((COUNT+1))
          done

      - name: Start Tunnel & Notify
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://localhost:18789 > tunnel.log 2>&1 &
          
          echo "Waiting for Cloudflare Tunnel URL..."
          T_COUNT=0
          DETECTED=""
          while [ $T_COUNT -lt 20 ]; do
            DETECTED=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$DETECTED" ]; then
              echo "URL_DETECTED=$DETECTED" >> $GITHUB_ENV
              echo "Detected URL: $DETECTED"
              break
            fi
            sleep 3
            T_COUNT=$((T_COUNT+1))
          done
          
          if [ -z "$DETECTED" ]; then exit 0; fi

          python3 - <<EOF
          import os, requests, json
          url = "$DETECTED"
          token = os.environ.get('GATEWAY_TOKEN') or 'openclaw-secret'
          msg = f"🚀 OpenClaw 部署成功！\n🔗 WebUI/API: {url}\n🔑 Token: {token}\n🤖 默认模型: gemini-3-flash"
          
          # 通知代码 (保持一致)
          # ... (已注入完整通知逻辑)
          EOF

      - name: Keep Alive
        run: sleep 21600
