name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw.git ~/openclaw-src
          cd ~/openclaw-src
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Restore Saved Config
        run: |
          mkdir -p ~/openclaw-src/config
          if [ -d ".openclaw-data/config" ]; then
            cp -r .openclaw-data/config/* ~/openclaw-src/config/
            echo "✅ Configuration restored from repository."
          fi
          if [ -f ".openclaw-data/openclaw.json" ]; then
            cp .openclaw-data/openclaw.json ~/openclaw-src/
            echo "✅ openclaw.json restored from repository."
          fi

      - name: Install Chrome, Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          pip install requests

      - name: Start Services & Auto-Sync
        run: |
          cd ~/openclaw-src
          google-chrome-stable --headless=new --remote-debugging-port=9222 --no-sandbox > chrome.log 2>&1 &
          
          # 启动后台同步脚本 (每10分钟同步一次配置回仓库)
          cat <<'EOF' > sync.sh
          while true; do
            sleep 600
            mkdir -p $GITHUB_WORKSPACE/.openclaw-data/config
            cp -r /home/runner/openclaw-src/config/* $GITHUB_WORKSPACE/.openclaw-data/config/ 2>/dev/null || true
            cp /home/runner/openclaw-src/openclaw.json $GITHUB_WORKSPACE/.openclaw-data/ 2>/dev/null || true
            cd $GITHUB_WORKSPACE
            git config user.name "OpenClaw-Bot"
            git config user.email "bot@openclaw.local"
            git add .openclaw-data/
            git commit -m "chore: auto-sync openclaw configuration" && git push origin main || echo "No changes to sync"
          done
          EOF
          bash sync.sh &
          
          # 启动网关
          node openclaw.mjs gateway > openclaw.log 2>&1 &
          
          echo "Waiting for OpenClaw Gateway to respond on port 3002..."
          MAX_RETRIES=40
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:3002 > /dev/null; then
              echo "OpenClaw Gateway is up and running!"
              break
            fi
            echo "Waiting for Gateway response... ($((COUNT+1))/$MAX_RETRIES)"
            sleep 5
            COUNT=$((COUNT+1))
          done
          
          if [ "${{ github.event.inputs.use_tunnel }}" == "true" ]; then
            cloudflared tunnel --url http://localhost:3002 > tunnel.log 2>&1 &
            sleep 15
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "URL_DETECTED=$TUNNEL_URL"
          fi

      - name: Notify Deployment
        if: env.URL_DETECTED != ''
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TUNNEL_URL: ${{ env.URL_DETECTED }}
        run: |
          python3 - <<EOF
          import os, requests, json
          url = os.environ.get('TUNNEL_URL')
          msg = f"🚀 OpenClaw 部署成功！\n🔗 API Base: {url}/v1\n⏳ 持续时间: 6小时\n💡 配置已自动从仓库加载。"
          
          # Telegram / Feishu 通知逻辑 (省略部分重复代码)
          EOF

      - name: Final Sync & Keep Alive
        if: always()
        run: |
          mkdir -p .openclaw-data/config
          cp -r /home/runner/openclaw-src/config/* .openclaw-data/config/ 2>/dev/null || true
          cp /home/runner/openclaw-src/openclaw.json .openclaw-data/ 2>/dev/null || true
          git config user.name "OpenClaw-Bot"
          git config user.email "bot@openclaw.local"
          git add .openclaw-data/
          git commit -m "chore: final sync openclaw configuration" && git push origin main || echo "Final sync: No changes"
          sleep 21600
