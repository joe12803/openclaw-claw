name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install via Official Script
        run: |
          # 官方一键安装脚本
          curl -fsSL https://openclaw.ai/install.sh | bash
          # 脚本通常会将 openclaw 命令加入路径，或者安装到 ~/.local/bin/openclaw

      - name: Configure OpenClaw
        env:
          RELAY_API_KEY: "sk-KhbSk9pyLHkw8AzPy"
          RELAY_API_BASE: "https://openclaw.994938.xyz/v1"
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          # 官方安装通常会在 ~/.openclaw 创建配置目录
          mkdir -p ~/.openclaw/config
          
          # 创建统一配置文件
          cat <<EOF > ~/.openclaw/config.json
          {
            "server": { "port": 3002, "host": "0.0.0.0" },
            "gateway": {
              "auth": { "enabled": true, "token": "${GATEWAY_TOKEN:-openclaw-secret}" }
            },
            "providers": [
              {
                "id": "relay-gemini",
                "type": "openai",
                "enabled": true,
                "config": {
                  "apiKey": "${RELAY_API_KEY}",
                  "baseUrl": "${RELAY_API_BASE}"
                },
                "models": [
                  { "id": "gemini-3-flash", "name": "Gemini 3 Flash (Relay)" }
                ]
              }
            ]
          }
          EOF
          # 同时在各个可能的位置备份一份
          cp ~/.openclaw/config.json ~/.openclaw/openclaw.json

      - name: Start OpenClaw
        run: |
          # 使用官方 CLI 启动网关模式，并强制非交互
          export OPENCLAW_NONINTERACTIVE=true
          export CI=true
          # 尝试多种可能的命令路径
          if command -v openclaw &> /dev/null; then
            openclaw gateway > openclaw.log 2>&1 &
          else
            ~/.local/bin/openclaw gateway > openclaw.log 2>&1 &
          fi
          
          echo "Waiting for OpenClaw Gateway to respond on port 3002..."
          MAX_RETRIES=40
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:3002 > /dev/null; then
              echo "OpenClaw Gateway is up and running!"
              break
            fi
            echo "Waiting for Gateway response... ($((COUNT+1))/$MAX_RETRIES)"
            sleep 5
            COUNT=$((COUNT+1))
          done

      - name: Start Tunnel & Notify
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          # 安装 cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          cloudflared tunnel --url http://localhost:3002 > tunnel.log 2>&1 &
          sleep 15
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
          
          if [ -n "$TUNNEL_URL" ]; then
            python3 - <<EOF
          import os, requests, json
          url = "$TUNNEL_URL"
          token = os.environ.get('GATEWAY_TOKEN') or 'openclaw-secret'
          msg = f"🚀 OpenClaw 官方脚本部署成功！\n🔗 API Base: {url}/v1\n🔑 Gateway Token: {token}\n🤖 测试模型: gemini-3-flash"
          
          # Telegram 推送
          requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", json={"chat_id": os.environ['TELEGRAM_CHAT_ID'], "text": msg})
          
          # Feishu 推送
          fs_id = os.environ['FEISHU_APP_ID']
          fs_secret = os.environ['FEISHU_APP_SECRET']
          token_res = requests.post("https://open.feishu.cn/open-apis/auth/v3/app_access_token/internal", json={"app_id": fs_id, "app_secret": fs_secret}).json()
          headers = {"Authorization": f"Bearer {token_res['app_access_token']}", "Content-Type": "application/json"}
          requests.post("https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id", headers=headers, json={"receive_id": os.environ['FEISHU_CHAT_ID'], "msg_type": "text", "content": json.dumps({"text": msg})})
          EOF
          else
            echo "Failed to generate Tunnel URL"
            cat openclaw.log
          fi

      - name: Keep Alive
        run: sleep 21600
