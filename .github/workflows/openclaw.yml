name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          # 克隆 OpenClaw Zero Token 源码
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw.git ~/openclaw-src
          cd ~/openclaw-src
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Install Chrome and Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure OpenClaw
        env:
          CLAUDE_SESSION_KEY: ${{ secrets.CLAUDE_SESSION_KEY }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          cd ~/openclaw-src
          # 生成基础配置
          cat <<EOF > openclaw.json
          {
            "server": {
              "port": 3002,
              "host": "0.0.0.0"
            },
            "gateway": {
              "auth": {
                "enabled": true,
                "token": "${GATEWAY_TOKEN:-openclaw-secret}"
              }
            }
          }
          EOF

      - name: Start Services
        run: |
          cd ~/openclaw-src
          
          # 1. 启动 Headless Chrome (用于 Cookie 注入/捕获)
          google-chrome-stable --headless=new --remote-debugging-port=9222 --no-sandbox &
          
          # 2. 启动 OpenClaw
          pnpm start &
          
          # 3. 启动 Cloudflare Tunnel
          if [ "${{ github.event.inputs.use_tunnel }}" == "true" ]; then
            cloudflared tunnel --url http://localhost:3002 > tunnel.log 2>&1 &
            sleep 15
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "OpenClaw API is live at: $TUNNEL_URL"
          fi
          
          # 保持运行 (Actions 限制 6 小时)
          sleep 21600
