name: OpenClaw Actions Runner
on:
  workflow_dispatch:
    inputs:
      run_bridge:
        description: 'Start OpenClaw API Bridge'
        type: boolean
        default: true

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenClaw (Official)
        run: |
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw ~/openclaw
          cd ~/openclaw
          npm install

      - name: Restore Data
        run: |
          mkdir -p ~/.openclaw
          if [ -d ".openclaw-data" ]; then
            cp -r .openclaw-data/* ~/.openclaw/ || true
          fi

      - name: Configure OpenClaw
        env:
          GEMINI_COOKIE: ${{ secrets.GEMINI_COOKIE }}
          CLAUDE_COOKIE: ${{ secrets.CLAUDE_COOKIE }}
          AUTH_TOKEN: ${{ secrets.OPENCLAW_AUTH_TOKEN || 'sk-123456' }}
        run: |
          # Official OpenClaw uses .env and config.json
          mkdir -p ~/openclaw/config
          cat <<EOF > ~/openclaw/config/config.json
          {
            "providers": {
              "gemini": {
                "cookie": "${GEMINI_COOKIE}"
              },
              "claude": {
                "cookie": "${CLAUDE_COOKIE}"
              }
            },
            "auth": {
              "token": "${AUTH_TOKEN}"
            }
          }
          EOF

      - name: Start Background Auto-Sync
        run: |
          cat <<'EOF' > sync.sh
          while true; do
            sleep 600
            mkdir -p .openclaw-data
            cp -r ~/openclaw/config .openclaw-data/ || true
            cp -r ~/openclaw/logs .openclaw-data/ || true
            git config --global user.name "openclaw-bot"
            git config --global user.email "openclaw-bot@users.noreply.github.com"
            git add .openclaw-data
            if ! git diff --cached --quiet; then
              git commit -m "chore: auto-sync openclaw state [skip ci]"
              git push origin main || echo "Push failed"
            fi
          done
          EOF
          chmod +x sync.sh
          ./sync.sh &

      - name: Start OpenClaw and Tunnel
        run: |
          # Install Cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # Start OpenClaw
          cd ~/openclaw
          npm start &
          
          # Start Tunnel
          cloudflared tunnel --url http://localhost:8001 &
          
          echo "Official OpenClaw (Node.js) is running."
          sleep 21600

      - name: Final Data Sync
        if: always()
        run: |
          mkdir -p .openclaw-data
          cp -r ~/openclaw/config .openclaw-data/ || true
          cp -r ~/openclaw/logs .openclaw-data/ || true
          git config --global user.name "openclaw-bot"
          git config --global user.email "openclaw-bot@users.noreply.github.com"
          git add .openclaw-data
          git commit -m "docs: final state sync" || echo "No changes"
          git push origin main
