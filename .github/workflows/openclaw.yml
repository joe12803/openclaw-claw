name: OpenClaw Runner
on:
  workflow_dispatch:
    inputs:
      relay_api_base:
        description: 'Relay API Base URL'
        default: 'https://openclaw.994938.xyz/v1'
        required: true
      relay_api_key:
        description: 'Relay API Key'
        default: 'sk-KhbSk9pyLHkw8AzPy'
        required: true
      run_openclaw:
        description: 'Start OpenClaw Service'
        type: boolean
        default: true
      use_tunnel:
        description: 'Expose via Cloudflare Tunnel'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manual Installation
        run: |
          git clone --depth 1 https://github.com/OpenClaw/OpenClaw.git ~/openclaw-src
          cd ~/openclaw-src
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Restore and Inject Configuration
        env:
          RELAY_API_KEY: ${{ github.event.inputs.relay_api_key }}
          RELAY_API_BASE: ${{ github.event.inputs.relay_api_base }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 创建基础目录
          mkdir -p ~/.openclaw/config
          
          # 2. 从仓库复刻你手动跑通的配置
          if [ -d ".openclaw-data/config" ]; then
            cp -r .openclaw-data/config/* ~/.openclaw/config/
            echo "✅ Config restored from repository."
          fi
          
          # 3. 强制注入当前 Secrets (防止仓库里的配置过期)
          # 使用 Python 脚本精确修改 JSON
          python3 - <<EOF
          import json, os
          path = os.path.expanduser('~/.openclaw/config/config.json')
          if not os.path.exists(path):
              # 如果不存在，则创建一个基础模板
              config = {"server":{"port":18789},"gateway":{"auth":{"enabled":True}}}
          else:
              with open(path, 'r') as f: config = json.load(f)
          
          # 强制更新核心字段
          config['gateway']['auth']['token'] = os.environ.get('GATEWAY_TOKEN') or config['gateway']['auth'].get('token') or 'openclaw-secret'
          
          # 更新 Providers
          if 'providers' not in config: config['providers'] = []
          relay_p = next((p for p in config['providers'] if p.get('id') == 'relay-api'), None)
          if not relay_p:
              relay_p = {"id": "relay-api", "type": "openai", "enabled": True, "config": {}, "models": [{"id":"gemini-3-flash","name":"Gemini 3 Flash","default":True}]}
              config['providers'].append(relay_p)
          
          relay_p['config']['apiKey'] = os.environ.get('RELAY_API_KEY')
          relay_p['config']['baseUrl'] = os.environ.get('RELAY_API_BASE')
          
          # 更新 Adapters
          if 'adapters' not in config: config['adapters'] = {}
          if 'telegram' not in config['adapters']: config['adapters']['telegram'] = {"enabled": True, "config": {}}
          config['adapters']['telegram']['config']['token'] = os.environ.get('TELEGRAM_BOT_TOKEN')
          config['adapters']['telegram']['config']['allowedUsers'] = [os.environ.get('TELEGRAM_CHAT_ID')]
          
          if 'feishu' not in config['adapters']: config['adapters']['feishu'] = {"enabled": True, "config": {}}
          config['adapters']['feishu']['config']['appId'] = os.environ.get('FEISHU_APP_ID')
          config['adapters']['feishu']['config']['appSecret'] = os.environ.get('FEISHU_APP_SECRET')
          
          with open(path, 'w') as f: json.dump(config, f, indent=2)
          print("✅ Configuration injected with latest secrets.")
          EOF
          
          # 保持源码目录同步
          cp ~/.openclaw/config/config.json ~/openclaw-src/openclaw.json

      - name: Start OpenClaw
        run: |
          export OPENCLAW_NONINTERACTIVE=true
          export CI=true
          sudo apt-get install -y expect
          cd ~/openclaw-src
          unbuffer ./openclaw.mjs gateway --verbose --allow-unconfigured > openclaw.log 2>&1 &
          
          echo "Waiting for OpenClaw Gateway..."
          MAX_RETRIES=40
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:18789 > /dev/null; then
              echo "✅ OpenClaw is up and aligned with your manual setup!"
              break
            fi
            sleep 5
            COUNT=$((COUNT+1))
          done

      - name: Start Tunnel & Notify
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://localhost:18789 > tunnel.log 2>&1 &
          
          echo "Waiting for Cloudflare Tunnel URL..."
          T_COUNT=0
          DETECTED=""
          while [ $T_COUNT -lt 20 ]; do
            DETECTED=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$DETECTED" ]; then
              echo "URL_DETECTED=$DETECTED" >> $GITHUB_ENV
              echo "Detected URL: $DETECTED"
              break
            fi
            sleep 3
            T_COUNT=$((T_COUNT+1))
          done
          
          if [ -z "$DETECTED" ]; then
            echo "❌ Tunnel detection failed."
            exit 0
          fi

          python3 - <<EOF
          import os, requests, json
          url = "$DETECTED"
          token = os.environ.get('GATEWAY_TOKEN') or 'openclaw-secret'
          msg = f"🚀 OpenClaw 部署成功！\n🔗 API Base: {url}/v1\n🔑 Gateway Token: {token}\n🤖 默认模型: gemini-3-flash"
          
          tg_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          tg_id = os.environ.get('TELEGRAM_CHAT_ID')
          if tg_token and tg_id:
              requests.post(f"https://api.telegram.org/bot{tg_token}/sendMessage", json={"chat_id": tg_id, "text": msg})
          
          fs_id = os.environ.get('FEISHU_APP_ID')
          fs_secret = os.environ.get('FEISHU_APP_SECRET')
          fs_chat_id = os.environ.get('FEISHU_CHAT_ID')
          if fs_id and fs_secret and fs_chat_id:
              id_type = "chat_id" if fs_chat_id.startswith("oc_") else "open_id"
              token_res = requests.post("https://open.feishu.cn/open-apis/auth/v3/app_access_token/internal", json={"app_id": fs_id, "app_secret": fs_secret}).json()
              app_token = token_res.get('app_access_token')
              if app_token:
                  send_url = f"https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type={id_type}"
                  headers = {"Authorization": f"Bearer {app_token}", "Content-Type": "application/json"}
                  payload = {"receive_id": fs_chat_id, "msg_type": "text", "content": json.dumps({"text": msg})}
                  requests.post(send_url, headers=headers, json=payload)
          EOF

      - name: Keep Alive
        run: sleep 21600
